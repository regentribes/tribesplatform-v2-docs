<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome to your MyCoNet clubhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: hsl(0 0% 100%);
    --bg-2: hsl(0 0% 97%);
    --bg-3: hsl(0 0% 94%);
    --surface: hsl(0 0% 100%);
    --ink: hsl(0 0% 9%);
    --ink-2: hsl(0 0% 22%);
    --ink-3: hsl(0 0% 45%);
    --ink-4: hsl(0 0% 65%);
    --rule: hsl(0 0% 89%);
    --rule-soft: hsl(0 0% 93%);
    --accent: hsl(142 76% 36%);
    --accent-soft: hsl(142 50% 93%);
    --display: 'Open Sans', sans-serif;
    --mono: 'JetBrains Mono', Menlo, monospace;
    --radius: 8px;
    --radius-lg: 12px;
    --radius-xl: 18px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    --shadow-md: 0 4px 16px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04);
    --shadow-lg: 0 12px 36px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);

    /* Module colors */
    --m1: #92400e;
    --m4: #ca8a04;
    --m5: #15803d;
    --m6: #1d4ed8;
    --m7: #4338ca;
    --m8: #7c3aed;
    --m9: #db2777;
  }

  [data-theme="dark"] {
    --bg: hsl(0 0% 7%);
    --bg-2: hsl(0 0% 11%);
    --bg-3: hsl(0 0% 14%);
    --surface: hsl(0 0% 10%);
    --ink: hsl(0 0% 95%);
    --ink-2: hsl(0 0% 80%);
    --ink-3: hsl(0 0% 60%);
    --ink-4: hsl(0 0% 38%);
    --rule: hsl(0 0% 18%);
    --rule-soft: hsl(0 0% 15%);
    --accent: hsl(142 70% 50%);
    --accent-soft: hsl(142 30% 14%);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--display);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ── Top bar ── */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: radial-gradient(circle at 30% 30%, var(--accent), color-mix(in srgb, var(--accent) 60%, #000));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
    position: relative;
  }
  .logo-mark::before, .logo-mark::after {
    content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.85);
  }
  .logo-mark::before { width: 5px; height: 5px; top: 7px; left: 7px; }
  .logo-mark::after  { width: 3px; height: 3px; top: 17px; left: 16px; opacity: .7; }
  .topnav { display: flex; gap: 4px; align-items: center; }
  .topnav-link {
    font-size: 13px; padding: 8px 12px; border-radius: 999px; color: var(--ink-3);
    transition: background 120ms, color 120ms;
  }
  .topnav-link:hover { background: var(--bg-2); color: var(--ink); }
  .topnav-link.is-current { color: var(--ink); background: var(--bg-2); }
  .topnav-cta {
    background: var(--accent); color: #fff !important;
    padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    transition: filter 120ms;
  }
  .topnav-cta:hover { filter: brightness(1.1); }

  /* ── Hero ── */
  .hero { padding: 80px 28px 40px; max-width: 1180px; margin: 0 auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent);
    padding: 5px 12px 5px 10px; border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .pill::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    animation: ping 1.6s ease-out infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); }
    100% { box-shadow: 0 0 0 8px transparent; }
  }
  .hero h1 {
    font-size: clamp(40px, 6vw, 68px);
    line-height: 1.02; letter-spacing: -0.025em;
    margin: 22px 0 22px;
    font-weight: 700;
    text-wrap: balance;
    max-width: 14ch;
  }
  .hero h1 .accent { color: var(--accent); }
  .hero h1 .underline {
    background-image: linear-gradient(transparent 65%, color-mix(in srgb, var(--accent) 28%, transparent) 65%);
    padding: 0 4px; margin: 0 -4px;
  }
  .hero p.lead {
    font-size: 18px; line-height: 1.6; color: var(--ink-2); max-width: 56ch; margin: 0 0 32px;
    text-wrap: pretty;
  }
  .hero .cta-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 14.5px;
    border: 1px solid transparent; transition: all 140ms;
  }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-secondary {
    background: var(--surface); color: var(--ink); border-color: var(--rule);
  }
  .btn-secondary:hover { background: var(--bg-2); }
  .btn .arrow { transition: transform 140ms; }
  .btn:hover .arrow { transform: translateX(3px); }

  /* ── Clubhouse preview ── */
  .clubhouse {
    margin: 56px auto 0; max-width: 1180px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    position: relative;
  }
  .clubhouse::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%);
    pointer-events: none;
  }
  .clubhouse-chrome {
    display: flex; align-items: center; gap: 6px;
    padding: 12px 16px; border-bottom: 1px solid var(--rule);
    background: var(--bg-2);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ef5f57; } .dot.y { background: #f7bd2e; } .dot.g { background: #28c93f; }
  .url-bar {
    margin-left: 14px; padding: 5px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--rule);
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
    flex: 1; max-width: 380px;
  }
  .url-bar .lock { color: var(--accent); margin-right: 6px; }
  .clubhouse-body {
    display: grid; grid-template-columns: 230px 1fr;
    min-height: 540px;
  }
  .ch-side {
    border-right: 1px solid var(--rule); padding: 22px 14px; background: var(--bg-2);
  }
  .ch-side .who {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    margin-bottom: 16px; border-radius: var(--radius);
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
    background: linear-gradient(135deg, var(--m1), var(--m4));
    flex-shrink: 0;
  }
  .ch-side .who .name { font-weight: 600; font-size: 13.5px; }
  .ch-side .who .role {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px;
  }
  .ch-nav { display: flex; flex-direction: column; gap: 1px; }
  .ch-nav-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4);
    padding: 12px 8px 6px;
  }
  .ch-nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px; border-radius: var(--radius); font-size: 13px; color: var(--ink-2);
    cursor: pointer; transition: background 120ms;
  }
  .ch-nav-item:hover { background: var(--bg-3); }
  .ch-nav-item.is-active { background: var(--bg-3); color: var(--ink); font-weight: 600; }
  .ch-nav-item .mnum {
    font-family: var(--mono); font-size: 10px; color: var(--ink-4); font-weight: 600;
    width: 22px;
  }
  .ch-nav-item .swatch {
    width: 4px; height: 14px; border-radius: 2px; flex-shrink: 0;
  }

  .ch-main { padding: 28px; overflow: hidden; }
  .ch-greet {
    font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 4px;
  }
  .ch-sub { font-size: 13px; color: var(--ink-3); margin: 0 0 24px; }

  .ch-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  .ch-card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 14px 14px 12px;
    display: flex; flex-direction: column; gap: 6px;
    position: relative; overflow: hidden;
    transition: transform 160ms, box-shadow 160ms;
  }
  .ch-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .ch-card .accent-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .ch-card .row1 { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .ch-card .mtag {
    font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  }
  .ch-card .badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fff; padding: 2px 7px; border-radius: 999px;
  }
  .ch-card .title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .ch-card .desc { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

  /* ── Section scaffolding ── */
  .section {
    max-width: 1180px; margin: 0 auto; padding: 110px 28px 0;
  }
  .section-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px;
    margin-bottom: 14px;
  }
  .section-eyebrow .mod-dot { width: 7px; height: 7px; border-radius: 50%; }
  .section-h {
    font-size: clamp(28px, 3.6vw, 42px); line-height: 1.1;
    letter-spacing: -0.02em; margin: 0 0 14px; font-weight: 700;
    text-wrap: balance; max-width: 22ch;
  }
  .section-lead {
    font-size: 16px; color: var(--ink-2); line-height: 1.65;
    max-width: 60ch; margin: 0 0 36px; text-wrap: pretty;
  }
  .section-split {
    display: grid; grid-template-columns: 1fr 1.2fr; gap: 56px; align-items: center;
  }
  .section-split.reverse > :first-child { order: 2; }

  /* Demo card frame */
  .demo {
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding: 22px; overflow: hidden; position: relative;
  }
  .demo-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 12px;
  }
  .demo-title { display: flex; align-items: center; gap: 10px; }
  .demo-title .mod {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; color: #fff;
  }
  .demo-title strong { font-size: 14.5px; }

  /* Bullet list */
  .why { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
  .why-row { display: flex; gap: 12px; align-items: flex-start; }
  .why-row .check {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .why-row .check svg { width: 12px; height: 12px; }
  .why-row p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.55; }
  .why-row strong { color: var(--ink); font-weight: 600; }

  /* ── M01 Network demo ── */
  .neighbor-card {
    display: flex; gap: 12px; padding: 12px; border: 1px solid var(--rule);
    border-radius: var(--radius); background: var(--surface);
    transition: transform 160ms;
  }
  .neighbor-card:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--m1) 30%, var(--rule)); }
  .neighbor-card .av {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
  }
  .neighbor-card .meta { flex: 1; min-width: 0; }
  .neighbor-card .name-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;
  }
  .neighbor-card .nname { font-weight: 600; font-size: 13.5px; }
  .neighbor-card .where { font-size: 11.5px; color: var(--ink-3); margin-bottom: 6px; }
  .neighbor-card .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    background: var(--bg-2); color: var(--ink-2); border: 1px solid var(--rule-soft);
    font-weight: 500;
  }
  .chip.k-offer { background: color-mix(in srgb, var(--m5) 10%, transparent); color: var(--m5); }
  .chip.k-seek { background: color-mix(in srgb, var(--m6) 10%, transparent); color: var(--m6); }
  .match {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 999px;
    color: var(--m1); background: color-mix(in srgb, var(--m1) 12%, transparent);
  }

  /* ── M04 Blueprint demo ── */
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 18px; }
  .phase {
    padding: 10px; border-radius: 8px; border: 1px solid var(--rule);
    text-align: center; position: relative;
    background: var(--surface);
  }
  .phase.done { background: color-mix(in srgb, var(--m4) 8%, transparent); border-color: color-mix(in srgb, var(--m4) 25%, var(--rule)); }
  .phase.active {
    background: var(--m4); color: #fff; border-color: var(--m4);
    box-shadow: 0 4px 14px color-mix(in srgb, var(--m4) 30%, transparent);
  }
  .phase .pname { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
  .phase .ptag { font-size: 9.5px; opacity: .7; margin-top: 2px; }

  .pillars { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .pillar { display: grid; grid-template-columns: 92px 1fr 32px; gap: 10px; align-items: center; }
  .pillar .pn { font-size: 11.5px; color: var(--ink-2); }
  .pillar .pbar { height: 6px; border-radius: 999px; background: var(--bg-3); overflow: hidden; }
  .pillar .pbar > div { height: 100%; background: var(--m4); border-radius: 999px; transition: width 1.2s cubic-bezier(.4,1,.4,1); }
  .pillar .pval { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; }

  /* ── M05 Values ── */
  .values { display: flex; flex-direction: column; gap: 10px; }
  .value-row {
    display: flex; gap: 12px; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--rule); background: var(--surface);
    cursor: pointer; transition: all 140ms;
    align-items: flex-start;
  }
  .value-row:hover { border-color: color-mix(in srgb, var(--m5) 40%, var(--rule)); }
  .value-row.checked {
    background: color-mix(in srgb, var(--m5) 6%, var(--surface));
    border-color: color-mix(in srgb, var(--m5) 40%, var(--rule));
  }
  .value-row .box {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid var(--rule); background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    transition: all 140ms; margin-top: 1px;
  }
  .value-row.checked .box { background: var(--m5); border-color: var(--m5); }
  .value-row.checked .box svg { color: #fff; }
  .value-row .box svg { width: 12px; height: 12px; color: transparent; }
  .value-row .vtext .vt { font-size: 13.5px; font-weight: 600; }
  .value-row .vtext .vd { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
  .value-cta {
    margin-top: 14px; padding: 11px 18px; border-radius: 10px;
    border: none; background: var(--m5); color: #fff; font-weight: 600;
    font-size: 13.5px; transition: all 140ms;
    width: 100%;
  }
  .value-cta:hover:not(:disabled) { filter: brightness(1.1); }
  .value-cta:disabled { background: var(--bg-3); color: var(--ink-4); cursor: not-allowed; }

  /* ── M06 Browse projects ── */
  .proj-list { display: flex; flex-direction: column; gap: 10px; }
  .proj-card {
    border: 1px solid var(--rule); border-radius: 10px; padding: 14px;
    background: var(--surface);
    transition: all 140ms;
  }
  .proj-card.selected {
    border-color: var(--m6);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--m6) 12%, transparent);
  }
  .proj-card .ptitle { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .proj-card .ptitle h4 { margin: 0; font-size: 14px; font-weight: 600; }
  .proj-card .open {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--m5); background: color-mix(in srgb, var(--m5) 12%, transparent);
    padding: 2px 7px; border-radius: 999px; flex-shrink: 0;
  }
  .proj-card .pdesc { font-size: 12px; color: var(--ink-3); margin: 4px 0 8px; line-height: 1.55; }
  .proj-card .pneeds { display: flex; gap: 4px; flex-wrap: wrap; }
  .agreement {
    margin-top: 12px; border: 1px dashed color-mix(in srgb, var(--m6) 35%, var(--rule));
    border-radius: 10px; padding: 14px;
    background: color-mix(in srgb, var(--m6) 4%, var(--surface));
  }
  .agreement .alabel {
    font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--m6); margin-bottom: 4px;
  }
  .agreement textarea, .agreement input {
    width: 100%; border: 1px solid var(--rule); border-radius: 8px;
    padding: 8px 10px; font-family: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--surface); resize: vertical;
  }
  .agreement textarea:focus, .agreement input:focus {
    outline: none; border-color: var(--m6);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--m6) 15%, transparent);
  }
  .agreement label { font-size: 11.5px; color: var(--ink-2); font-weight: 500; display: block; margin-bottom: 5px; }
  .agreement .field + .field { margin-top: 10px; }
  .agreement .submit {
    margin-top: 10px; padding: 8px 14px; border-radius: 8px;
    background: var(--m6); color: #fff; border: none; font-weight: 600; font-size: 12.5px;
  }

  /* ── M07 Ops monitoring ── */
  .ops-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
  }
  .ops-head .otitle { font-size: 14.5px; font-weight: 600; }
  .ops-head .ostat {
    font-size: 11px; font-family: var(--mono); font-weight: 600; color: var(--ink-3);
  }
  .ops-stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat {
    background: var(--bg-2); border: 1px solid var(--rule); border-radius: 10px;
    padding: 12px; text-align: left;
  }
  .stat .sn {
    font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--m7);
  }
  .stat .sl {
    font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 600; margin-top: 2px;
  }
  .deliverables { display: flex; flex-direction: column; gap: 4px; }
  .deliv {
    display: grid; grid-template-columns: 22px 1fr 70px 80px;
    gap: 10px; align-items: center; padding: 9px 10px;
    border-radius: 8px;
    font-size: 12.5px;
  }
  .deliv:hover { background: var(--bg-2); }
  .deliv .di-box {
    width: 18px; height: 18px; border-radius: 5px;
    border: 1.5px solid var(--rule); display: flex; align-items: center; justify-content: center;
  }
  .deliv.done .di-box { background: var(--m7); border-color: var(--m7); }
  .deliv.done .di-box svg { width: 11px; height: 11px; color: #fff; }
  .deliv.done .dname { text-decoration: line-through; color: var(--ink-3); }
  .deliv .dname { font-weight: 500; }
  .deliv .dwho {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  }
  .deliv .ddue { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); text-align: right; }
  .deliv .ddue.late { color: #d44; }

  /* ── M08 Contributions ── */
  .points-hero {
    display: flex; align-items: center; gap: 18px; padding: 18px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--m8) 90%, #000), var(--m8));
    color: #fff; border-radius: 12px; margin-bottom: 18px;
    position: relative; overflow: hidden;
  }
  .points-hero::before {
    content: ''; position: absolute; right: -30px; top: -30px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .points-num {
    font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: -0.02em;
  }
  .points-label {
    font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
  }
  .points-info { flex: 1; }
  .points-rank {
    font-size: 13px; opacity: 0.95;
  }
  .badge-row {
    display: flex; gap: 6px; margin-top: 8px;
  }
  .badge-circ {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .badge-circ.locked { opacity: 0.3; background: rgba(255,255,255,0.08); }
  .log-form {
    display: grid; grid-template-columns: 1fr 130px 100px; gap: 8px;
    padding: 12px; border: 1px solid var(--rule); border-radius: 10px;
    background: var(--bg-2); margin-bottom: 14px;
  }
  .log-form input, .log-form select {
    border: 1px solid var(--rule); border-radius: 7px; padding: 8px 10px;
    font: inherit; font-size: 12.5px; background: var(--surface); color: var(--ink);
  }
  .log-form button {
    background: var(--m8); color: #fff; border: none; border-radius: 7px; font-weight: 600;
    font-size: 12.5px;
  }
  .log-list { display: flex; flex-direction: column; gap: 4px; }
  .log-row {
    display: grid; grid-template-columns: 1fr 100px 50px;
    gap: 10px; padding: 8px 10px; align-items: center;
    font-size: 12.5px; border-radius: 6px;
  }
  .log-row:nth-child(odd) { background: var(--bg-2); }
  .log-row .lwhen { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .log-row .lpts {
    font-family: var(--mono); font-weight: 700; font-size: 12.5px; color: var(--m8);
    text-align: right;
  }

  /* ── M09 Governance ── */
  .gov-layers {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 18px;
  }
  .gov-layer {
    padding: 14px; border-radius: 12px; border: 1px solid var(--rule);
    background: var(--surface); cursor: pointer; transition: all 160ms;
    position: relative; overflow: hidden;
  }
  .gov-layer:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .gov-layer.active {
    border-color: var(--m9);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--m9) 12%, transparent);
  }
  .gov-layer .layer-num {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    color: var(--m9); letter-spacing: 0.08em;
  }
  .gov-layer .layer-name { font-size: 14px; font-weight: 600; margin: 4px 0 4px; }
  .gov-layer .layer-desc { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
  .gov-layer .layer-mark {
    position: absolute; right: 12px; top: 12px;
    font-family: var(--mono); font-size: 14px; opacity: 0.18; font-weight: 700;
  }
  .proposal {
    padding: 16px; border-radius: 12px; border: 1px solid var(--rule);
    background: var(--bg-2);
  }
  .proposal h4 { margin: 0 0 4px; font-size: 14px; }
  .proposal .pmeta { font-size: 11.5px; color: var(--ink-3); margin-bottom: 12px; }
  .vote-bar {
    display: flex; height: 32px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--rule);
    margin-bottom: 10px;
  }
  .vote-seg { display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff;
    transition: flex 800ms cubic-bezier(.4,1,.4,1);
  }
  .vote-seg.yes { background: var(--m5); }
  .vote-seg.concern { background: #f59e0b; }
  .vote-seg.no { background: #ef4444; }
  .vote-buttons {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  }
  .vote-btn {
    padding: 9px; border-radius: 8px; border: 1px solid var(--rule);
    background: var(--surface); font-size: 12.5px; font-weight: 600;
    transition: all 140ms;
  }
  .vote-btn:hover { transform: translateY(-1px); }
  .vote-btn.cast { background: var(--m9); color: #fff; border-color: var(--m9); }

  /* ── Closing CTA ── */
  .closing {
    margin: 130px auto 80px; max-width: 920px; padding: 0 28px;
    text-align: center;
  }
  .closing-box {
    padding: 72px 36px;
    border-radius: var(--radius-xl);
    background:
      radial-gradient(ellipse 60% 100% at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 80%),
      var(--bg-2);
    border: 1px solid var(--rule);
    position: relative; overflow: hidden;
  }
  .closing h2 { font-size: clamp(30px, 4.5vw, 46px); letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 18px; font-weight: 700; }
  .closing p { color: var(--ink-2); font-size: 17px; max-width: 52ch; margin: 0 auto 28px; line-height: 1.6; }
  .closing .cta-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .closing .footnote {
    margin-top: 36px; font-family: var(--mono); font-size: 11px; color: var(--ink-4);
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  footer.site {
    border-top: 1px solid var(--rule);
    padding: 24px 28px; text-align: center;
    color: var(--ink-4); font-size: 11.5px; font-family: var(--mono); letter-spacing: 0.05em;
  }

  /* ── Mobile ── */
  @media (max-width: 880px) {
    .clubhouse-body { grid-template-columns: 1fr; }
    .ch-side { border-right: none; border-bottom: 1px solid var(--rule); }
    .ch-grid { grid-template-columns: 1fr 1fr; }
    .section-split { grid-template-columns: 1fr; gap: 32px; }
    .section-split.reverse > :first-child { order: 0; }
    .gov-layers { grid-template-columns: 1fr; }
    .log-form { grid-template-columns: 1fr; }
    .deliv { grid-template-columns: 22px 1fr; }
    .deliv .dwho, .deliv .ddue { display: none; }
  }
</style>
</head>
